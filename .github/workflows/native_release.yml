# Builds the native library for every target and publishes the files as a
# GitHub release (native_prebuilt ADR 001 D5, D6, D8). Start it with
#   git push -f origin HEAD:native-release       (release)
#   git push -f origin HEAD:native-release-dry   (build only, no upload)
# or with workflow_dispatch. On success it pushes the branch
# native-manifest/<tag> with native_artifacts/prebuilt.json. Merge that
# branch to use the release.
#
# Targets are the ones of the old release.yml. iOS and Android come later
# (ADR workplan step 8); until then those targets build from source.
name: native release
run-name: Native release / ${{ (github.ref_name == 'native-release-dry' || inputs.dry_run) && 'build only' || 'publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, upload nothing.
        type: boolean
        default: false
  push:
    branches: [native-release, native-release-dry]

concurrency:
  group: native-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.47.1'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on Ubuntu 22.04, so the library needs glibc 2.35 or
          # newer (native_prebuilt ADR 001 R8, R9, D8).
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025-vs2026 }
          - { target: windows-arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # telosnex_audio depends on the Flutter SDK. Flutter has no archive for
      # ARM64 Linux and Windows hosts, so every job uses a git clone of the
      # tag (as fllama does).
      - name: Install Flutter
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics > /dev/null
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build g++ libasound2-dev libpulse-dev

      - name: Describe the toolchain
        id: toolchain
        run: |
          case "${{ matrix.target }}" in
            windows-*)
              vs="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property catalog_productDisplayVersion || true)"
              t="MSVC, Visual Studio ${vs:-unknown}" ;;
            macos-*) t="$(xcodebuild -version | sed -n 1p)" ;;
            linux-*) t="$(gcc --version | sed -n 1p)" ;;
          esac
          echo "Toolchain: $t"
          echo "value=$t" >> "$GITHUB_OUTPUT"

      # flutter pub get also downloads sky_engine, which dart pub get needs.
      - run: flutter pub get --no-example

      # Files go to $RUNNER_TEMP: untracked files in the checkout count in
      # the source key.
      - name: Set paths
        run: echo "OUT=$RUNNER_TEMP/native" >> "$GITHUB_ENV"

      - &clean
        name: Check that the work tree is clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::Untracked or changed files would change the source key."
            exit 1
          fi

      - name: Source key
        run: |
          mkdir -p "$OUT/key"
          dart run native_prebuilt:key --list > "$OUT/key/${{ matrix.target }}.txt"
          tail -1 "$OUT/key/${{ matrix.target }}.txt"

      - name: Build
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.value }}
        run: |
          dart run native_prebuilt:build \
            --target "${{ matrix.target }}" \
            --out "$OUT/out/${{ matrix.target }}" \
            --runner "${{ matrix.runner }}" \
            --toolchain "$TOOLCHAIN"
          cat "$OUT/out/${{ matrix.target }}/target.json"

      - *clean

      - name: Check the glibc requirement (Linux)
        if: runner.os == 'Linux'
        run: |
          lib="$OUT/out/${{ matrix.target }}/libtelosnex_audio.so"
          newest="$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "Newest glibc requirement: $newest"
          test "$(printf '%s\n' GLIBC_2.35 "$newest" | sort -V | tail -1)" = GLIBC_2.35

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    # Only the owner publishes, from this repository.
    if: >-
      github.repository == 'Telosnex/telosnex_audio' &&
      github.actor == 'jpohhhh' && github.triggering_actor == 'jpohhhh'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.ref_name == 'native-release-dry' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install Flutter
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics > /dev/null
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get --no-example
      - run: echo "ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Compare the source keys of all runners (I2)
        run: |
          dart run native_prebuilt:key --list > "$RUNNER_TEMP/local-key.txt"
          status=0
          for f in "$ARTIFACTS"/key/*.txt; do
            if ! diff -u "$RUNNER_TEMP/local-key.txt" "$f"; then
              echo "::error::The source key on $(basename "$f" .txt) differs."
              status=1
            fi
          done
          exit $status

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--staging "$RUNNER_TEMP/staging")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          dart run native_prebuilt:release "${args[@]}" "$ARTIFACTS/out"
          cat native_artifacts/prebuilt.json

      # Workflows may not open pull requests (org setting), and main requires
      # a pull request with passing CI. A person opens it from this branch.
      - name: Push the manifest branch
        if: env.DRY_RUN != 'true'
        run: |
          tag="native-$(dart run native_prebuilt:key | tail -1 | cut -c1-16)"
          branch="native-manifest/$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add native_artifacts/prebuilt.json
          git commit -m "native: prebuilt files of release $tag"
          git push origin "$branch"
          {
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo
            echo "Open a pull request from \`$branch\` and merge it to use the release."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-manifest
          path: native_artifacts/prebuilt.json
