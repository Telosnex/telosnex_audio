# Daily: do the sources in .github/upstream.yaml have an update? The run
# fails when one does, and GitHub emails whoever last changed this file.
# See Upstream watch in the telosnex_ci_tools README.
name: Upstream watch

on:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches: [main]
    # Also the files that set the pins, so a vendor update re-checks them.
    paths:
      - .github/upstream.yaml
      - .github/vendor_watch.dart
      - .github/workflows/upstream_watch.yml
      - tool/vendor_manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/upstream_watch.yml@461a03187b073db7df0237e9666e4fbd6782627d # v0.5.18
