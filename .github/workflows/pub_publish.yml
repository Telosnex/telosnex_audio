# Publishes telosnex_audio to pub.dev from a release tag
# (pub-telosnex_audio-v1.2.3), with telosnex_ci_tools' pub_publish.yml. On pub.dev,
# the package's Admin page allows automated publishing from this repository:
# tag pattern pub-telosnex_audio-v{{version}}, environment pub.dev.
name: Pub publish

on:
  push:
    tags: ['pub-telosnex_audio-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/pub_publish.yml@46806695c593ec632eb26996046ea89649a1a6f7 # v0.5.9
    permissions:
      contents: write # the published branch
      id-token: write
    with:
      test: flutter test test/engine_test.dart test/isolate_exit_test.dart test/licenses_test.dart test/hook_build_test.dart test/vendor_watch_test.dart
