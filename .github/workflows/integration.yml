# One job per desktop platform runs the native C++ tests and the platform
# device (macOS: plain, ThreadSanitizer, an x86_64 compile, the virtual sound
# device through CoreAudio and Apple voice processing; Linux x64 and arm64:
# PulseAudio null sink, and ALSA on snd-aloop in a VM; Windows x64 and arm64,
# and an arm64 cross compile: VB-CABLE, Core Audio), then the example app
# (Dart API tests on the VM, the app build through the native-assets hook,
# and the engine cases of test/engine_cases.dart inside the app). Also: the
# iOS simulator, the Android emulator and an all-ABI Android build, and the
# web engine (wasm core tests in Chrome, the real-time AudioWorklet check in
# Chrome, Firefox and Safari, on a wasm built from these sources in the image
# of the release workflow).
name: Integration

on:
  push:
    branches: [main, 'ci/**']
  schedule:
    - cron: '11 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  # One job per platform, in two blocks that do not depend on each other: a
  # failure in one does not skip the other (step ids and if:). The engine
  # block: native C++ tests and the platform's real audio device, without
  # Flutter. The Flutter block: Dart API tests, the example app build
  # through the hook, and the engine cases in the app (manual device). Steps
  # are shared as YAML anchors, defined in the first job that uses them.
  desktop-macos-arm64:
    name: macOS ARM64
    env:
      PLATFORM: macos
      CHECK: test -d build/macos/Build/Products/Debug/telosnex_audio_example.app/Contents/Frameworks/telosnex_audio.framework
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - &checkout
        name: Checkout
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build tools
        run: |
          set -euo pipefail
          command -v ninja || brew install ninja
          cmake --version
          ninja --version

      # Engine block.
      - name: Build and run native tests
        id: engine
        run: |
          set -euo pipefail
          cmake -S . -B build/test -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTSNX_BUILD_TESTS=ON
          cmake --build build/test --target tsnx_tests
          ./build/test/native_test/tsnx_tests

      # macOS runners have an "Apple Virtual Sound Device" (in and out), so
      # both macOS devices open, select each route, play and capture: the
      # CoreAudio ADM and AudioEngineDevice (AVAudioEngine, Apple voice
      # processing). echo_probe fails when the engine does not open, a
      # selection does not show, a request fails, a second has no capture, or
      # the track does not move; the alarm catches a start/stop hang. Its
      # levels mean nothing on the virtual device.
      - name: Platform devices (CoreAudio, Apple voice processing)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: |
          set -euo pipefail
          cmake -S . -B build/test -DTSNX_BUILD_PROBE=ON
          cmake --build build/test --target echo_probe
          for vp in "" --apple-vp; do
            perl -e 'alarm shift; exec @ARGV' 60 ./build/test/echo_probe --routes $vp
            perl -e 'alarm shift; exec @ARGV' 60 ./build/test/echo_probe $vp 3
          done

      - name: ThreadSanitizer
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          tsan=-fsanitize=thread
          cmake -S . -B build/tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTSNX_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS=$tsan -DCMAKE_CXX_FLAGS=$tsan -DCMAKE_OBJCXX_FLAGS=$tsan \
            -DCMAKE_EXE_LINKER_FLAGS=$tsan -DCMAKE_SHARED_LINKER_FLAGS=$tsan
          cmake --build build/tsan --target tsnx_tests
          TSAN_OPTIONS=halt_on_error=1 ./build/tsan/native_test/tsnx_tests

      - name: Compile for macOS x86_64
        id: x86_64
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          cmake -S . -B build/x64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build/x64 --target telosnex_audio
          file build/x64/libtelosnex_audio.dylib | grep -q x86_64

      - name: Exported symbols are tsnx_* only (ADR D5)
        if: ${{ !cancelled() && steps.x86_64.outcome == 'success' }}
        run: |
          set -euo pipefail
          nm -gU build/x64/libtelosnex_audio.dylib | awk '{print $3}' | tee /tmp/exports.txt
          ! grep -v '^_tsnx_' /tmp/exports.txt

      # Flutter block.
      - &setup_flutter
        id: flutter
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5

      # The engine cases with the manual device, and an engine that outlives
      # its isolate (hot restart), through FFI on the VM.
      - &dart_api_tests
        name: Dart API tests (builds the native asset)
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/engine_test.dart test/isolate_exit_test.dart

      - &example_build
        name: Example app builds through the hook
        id: example
        if: ${{ !cancelled() && steps.flutter.outcome == 'success' }}
        working-directory: example
        run: |
          set -euo pipefail
          flutter pub get
          flutter build "$PLATFORM" --debug
          ${{ env.CHECK }}

      - &example_cases
        name: Engine cases in the example app
        if: ${{ !cancelled() && steps.example.outcome == 'success' }}
        working-directory: example
        env:
          DEVICE: ${{ env.PLATFORM }}
        run: |
          set -euo pipefail
          run=(flutter test integration_test/engine_test.dart -d "$DEVICE" -r expanded)
          if [[ "$RUNNER_OS" == Linux ]]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"

  # Linux: both jobs share all their steps (YAML anchor).
  desktop-linux-x64:
    name: Linux x64
    env:
      ARCH: x64
      PLATFORM: linux
      CHECK: test -f build/linux/x64/debug/bundle/lib/libtelosnex_audio.so
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps: &linux_steps
      - *checkout

      - name: Package cache key
        id: apt
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Downloaded packages kept between runs (with the ALSA VM's kernel and
      # QEMU): the Azure mirror sometimes serves at 50 kB/s, which made one
      # install take 20 min and timed the job out (2026-10-27).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs/*.deb
          key: apt-debs-${{ runner.arch }}-${{ steps.apt.outputs.month }}-${{ hashFiles('.github/workflows/integration.yml', 'tool/ci/alsa_vm.sh') }}
          restore-keys: apt-debs-${{ runner.arch }}-

      - name: Install build tools, audio headers and Flutter's Linux dependencies
        env:
          APT_ARCHIVES: ${{ runner.temp }}/apt-debs
        run: |
          set -euo pipefail
          mkdir -p "$APT_ARCHIVES/partial"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$APT_ARCHIVES" \
            cmake ninja-build g++ clang pkg-config libgtk-3-dev libasound2-dev libpulse-dev \
            pulseaudio pulseaudio-utils xvfb xauth

      # Engine block.
      - name: Build and run native tests
        id: engine
        run: |
          set -euo pipefail
          cmake -S . -B build/test -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTSNX_BUILD_TESTS=ON -DTSNX_BUILD_PROBE=ON
          cmake --build build/test
          ./build/test/native_test/tsnx_tests

      # The PulseAudio device on a null sink (its monitor is the mic, so the
      # APM sees the echo): routes, then 3 s of play and capture with clock
      # observation. echo_probe fails as on macOS (a failed request or
      # selection, a second without capture, a track that does not move);
      # the alarm catches a start/stop hang.
      - name: Platform device (PulseAudio null sink)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: |
          set -euo pipefail
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tsnx_null
          pactl set-default-sink tsnx_null
          pactl set-default-source tsnx_null.monitor
          perl -e 'alarm shift; exec @ARGV' 60 ./build/test/echo_probe --routes --pulse
          perl -e 'alarm shift; exec @ARGV' 60 ./build/test/echo_probe --pulse --clock observe 3

      - name: Exported symbols are tsnx_* only (ADR D5)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: |
          set -euo pipefail
          nm -D --defined-only build/test/libtelosnex_audio.so | awk '{print $3}' | tee /tmp/exports.txt
          ! grep -v '^tsnx_' /tmp/exports.txt

      # Flutter block.
      - *setup_flutter
      - *dart_api_tests
      - *example_build
      - *example_cases

      # Engine block, continued.
      # ALSA: the runners' kernel has no sound support, so tool/ci/alsa_vm.sh
      # boots Ubuntu's generic kernel under KVM over this file system and
      # runs the native tests and echo_probe on snd-aloop there (routes,
      # play and capture through the loop with clock observation, five
      # start/stop cycles). x64 only: the ARM64 runners have no /dev/kvm;
      # the ALSA code is the same on both. Last in the job: the script
      # unpacks the kernel packages over /, which replaces the /lib -> usr/lib
      # symlink with a directory, so later builds fail to link (libm.so.6).
      - name: Platform device (ALSA on snd-aloop, in a VM)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && env.ARCH == 'x64' }}
        env:
          APT_ARCHIVES: ${{ runner.temp }}/apt-debs
        run: tool/ci/alsa_vm.sh build/test

  desktop-linux-arm64:
    name: Linux ARM64
    env:
      ARCH: arm64
      PLATFORM: linux
      CHECK: test -f build/linux/arm64/debug/bundle/lib/libtelosnex_audio.so
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps: *linux_steps

  desktop-windows-x64:
    name: Windows x64
    env:
      PLATFORM: windows
      CHECK: test -f build/windows/x64/runner/Debug/telosnex_audio.dll
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    steps:
      - *checkout

      # VB-CABLE: the hosted runners have no audio endpoints.
      - &vbcable
        name: Install VB-CABLE
        id: vbcable
        shell: pwsh
        run: tool/ci/install_vbcable.ps1

      # Engine block.
      - name: Build and run native tests (x64), compile arm64
        id: engine
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -S . -B build\test -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTSNX_BUILD_TESTS=ON -DTSNX_BUILD_PROBE=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DTSNX_TARGET_ARCH=x64 || exit /b 1
          cmake --build build\test || exit /b 1
          build\test\native_test\tsnx_tests.exe || exit /b 1
          dumpbin /exports build\test\telosnex_audio.dll > exports.txt
          findstr /C:" tsnx_engine_open" exports.txt >nul || exit /b 1
          findstr /R /C:"^ *[1-9][0-9]*  *[0-9A-F][0-9A-F]*  *[0-9A-F][0-9A-F]*  *[^ ]" exports.txt | findstr /V /C:" tsnx_" && exit /b 1
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64 || exit /b 1
          cmake -S . -B build\arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DTSNX_TARGET_ARCH=arm64 || exit /b 1
          cmake --build build\arm64 --target telosnex_audio || exit /b 1

      # The Core Audio device on VB-CABLE: routes, 3 s of play and capture
      # with clock observation, and start/stop cycles. echo_probe fails on a
      # failed request, an engine error, a second without capture, or a
      # track that does not move; the alarm catches a hang.
      - &vbcable_probe
        name: Platform device (VB-CABLE)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && steps.vbcable.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          probe() { perl -e 'alarm shift; exec @ARGV' 60 build/test/echo_probe.exe "$@"; }
          probe --routes
          probe --clock observe 3
          for _ in 1 2 3; do probe 1; done

      # Flutter block.
      - *setup_flutter
      - *dart_api_tests
      - *example_build
      - *example_cases

  desktop-windows-arm64:
    name: Windows ARM64
    env:
      PLATFORM: windows
      CHECK: test -f build/windows/arm64/runner/Debug/telosnex_audio.dll
    runs-on: windows-11-arm
    timeout-minutes: 75
    steps:
      - *checkout
      - *vbcable

      # Engine block.
      - name: Build and run native tests (arm64)
        id: engine
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" arm64 || exit /b 1
          cmake -S . -B build\test -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTSNX_BUILD_TESTS=ON -DTSNX_BUILD_PROBE=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DTSNX_TARGET_ARCH=arm64 || exit /b 1
          cmake --build build\test || exit /b 1
          build\test\native_test\tsnx_tests.exe || exit /b 1
          dumpbin /exports build\test\telosnex_audio.dll > exports.txt
          findstr /C:" tsnx_engine_open" exports.txt >nul || exit /b 1
          findstr /R /C:"^ *[1-9][0-9]*  *[0-9A-F][0-9A-F]*  *[0-9A-F][0-9A-F]*  *[^ ]" exports.txt | findstr /V /C:" tsnx_" && exit /b 1
          exit /b 0

      - *vbcable_probe

      # Flutter block.
      - *setup_flutter
      - *dart_api_tests
      - *example_build
      - *example_cases

  android-universal:
    name: Android universal build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build

      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5

      - name: Example app builds through the hook
        run: |
          set -euo pipefail
          cd example
          flutter pub get
          flutter build apk --debug --target-platform android-arm,android-arm64,android-x64
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/apk.txt
          grep -q 'lib/armeabi-v7a/libtelosnex_audio.so' /tmp/apk.txt
          grep -q 'lib/arm64-v8a/libtelosnex_audio.so' /tmp/apk.txt
          grep -q 'lib/x86_64/libtelosnex_audio.so' /tmp/apk.txt

  ios:
    name: iOS ARM64 simulator
    # macos-26: the simulators of macos-15 missed the VM service line
    # (telosnex_ci_tools TESTING_WORKLOG.md).
    runs-on: macos-26
    # Simulator creation can retry for minutes, then up to three attempts.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build tools
        run: command -v ninja || brew install ninja

      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - id: simulator
        uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5

      # No build ahead (flutter build ios --simulator): its generic
      # destination does not match flutter test's -destination id=<udid>, and
      # Xcode rebuilds everything (fonnx, 2026-10-27). The first attempt runs
      # on the booted simulator; retries on fresh ones, while no test started.
      # The simulator logs of each attempt: the artifact ios-simulator-logs.
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
        with:
          working-directory: example
          target: integration_test/engine_test.dart
          udid: ${{ steps.simulator.outputs.udid }}
          artifact-name: ios-simulator-logs
          # The Xcode build is silent for minutes.
          idle-minutes: '15'
          # Launch to VM service took 40-190 s on passing attempts. When
          # flutter misses the app's VM service line, missed-line-seconds
          # (30) ends the attempt early.
          connect-seconds: '600'

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build

      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5

      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
        id: emulator
        with:
          api-level: '36'

      # The emulator starts with -no-audio (android-emulator), so only the
      # manual-device cases run; the AAudio device needs a real phone.
      - name: Engine cases in the example app
        working-directory: example
        env:
          SERIAL: ${{ steps.emulator.outputs.serial }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter test integration_test/engine_test.dart -d "$SERIAL" -r expanded

      - name: Upload the emulator logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          retention-days: 7

  web-files:
    name: Web files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # emscripten/emsdk:5.0.0, as in kiln_release.yml.
      image: emscripten/emsdk@sha256:67df07bc59f86685818fa801d340b54e576fe4276cfd3bcfc4da61d564217737
    steps:
      - name: Install unzip
        run: |
          command -v unzip > /dev/null || {
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends unzip > /dev/null
          }
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.1
      - name: Build telosnex_audio.wasm
        run: dart tool/kiln/build_web.dart --out "$RUNNER_TEMP/web"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: ${{ runner.temp }}/web/
          if-no-files-found: error
          retention-days: 7

  # Desktop browsers: the jobs share the steps of the first (YAML anchor).
  # BROWSER is the browser of tool/kiln/test_web.dart. Chrome runs the
  # engine cases, then the AudioWorklet check compiled to JS and to Wasm
  # (dart2js and dart2wasm); Firefox and Safari run the AudioWorklet check
  # compiled to JS only. Chrome and Firefox run on Linux (headless, with
  # fake media devices; the runner image has both browsers; Firefox with a
  # PulseAudio null sink), and only Safari on macOS: macOS runners are the
  # scarce ones.
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    needs: web-files
    env:
      BROWSER: chrome
      COMPILER: dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: &web_steps
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5

      - uses: Telosnex/telosnex_ci_tools/actions/download-artifact@027b68d29929047f2ba95034735d4b9e4be3c650 # v0.5.5
        with:
          name: web
          path: ${{ runner.temp }}/web

      # The scripts default to the macOS apps; the Linux image has both
      # browsers on PATH.
      - name: Browser paths (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "FIREFOX_EXECUTABLE=$(command -v firefox)" >> "$GITHUB_ENV"

      # Firefox on Linux starts no AudioContext without a sound server (it
      # stays suspended, as if waiting for a click). A PulseAudio null sink,
      # as in the Linux job's platform device step.
      - name: Sound server (Linux Firefox)
        if: runner.os == 'Linux' && env.BROWSER == 'firefox'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tsnx_null
          pactl set-default-sink tsnx_null
          pactl set-default-source tsnx_null.monitor

      - name: Safari remote automation
        if: env.BROWSER == 'safari'
        run: sudo safaridriver --enable

      # Chrome dart2js: the engine cases (wasm core, storage worker, ?v= on
      # every file), then the real-time AudioWorklet check (ADR step 9 gate).
      # Chrome dart2wasm, Firefox and Safari: the AudioWorklet check (flutter
      # test runs browser tests only in Chrome; Flutter runs dart2wasm builds
      # only in Chromium). Safari runs through safaridriver with
      # webkit:alwaysAllowAutoplay (no click) and WebKit's mock microphones.
      - name: Web tests
        run: dart tool/kiln/test_web.dart --from "$RUNNER_TEMP/web" --browser "$BROWSER" --compiler "$COMPILER"

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    needs: web-files
    env:
      BROWSER: chrome
      COMPILER: dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *web_steps

  web-linux-firefox-dart2js:
    name: Web Linux x64 Firefox dart2js
    needs: web-files
    env:
      BROWSER: firefox
      COMPILER: dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *web_steps

  web-macos-safari-dart2js:
    name: Web macOS ARM64 Safari dart2js
    needs: web-files
    env:
      BROWSER: safari
      COMPILER: dart2js
    # macos-26 as image_ffmpeg's Safari job (Safari 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps: *web_steps
