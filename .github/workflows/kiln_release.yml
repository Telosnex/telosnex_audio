# Builds the native library for every target and the web engine core, and
# publishes them as a GitHub release. Telosnex/telosnex_ci_tools has the
# jobs; tool/kiln/ has the telosnex_audio steps:
#
#   prepare.dart     Installs Ninja, and on Linux CMake and the audio headers.
#   test_build.dart  The Linux glibc 2.35 baseline and the Android 16 KB
#                    page alignment.
#   build_web.dart   Builds telosnex_audio.wasm with Emscripten 5.0.0.
#   test_web.dart    The Chrome engine tests and the real-time AudioWorklet
#                    check of the example app, compiled to JS and to Wasm.
#
# Start it with
#   git push -f origin HEAD:kiln-release       (release)
#   git push -f origin HEAD:kiln-release-dry   (build only, no upload)
# or with workflow_dispatch. On success it pushes the branch
# kiln-manifest/<tag>. Merge that branch to use the release.
name: Kiln release
run-name: Kiln release / ${{ (github.ref_name == 'kiln-release-dry' || inputs.dry_run) && 'build only' || 'publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, upload nothing.
        type: boolean
        default: false
  push:
    branches: [kiln-release, kiln-release-dry]

permissions:
  contents: read

jobs:
  kiln-release:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_release.yml@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
    permissions:
      contents: write
    with:
      dry-run: ${{ inputs.dry_run == true }}
      # The 10 default targets, and the Intel macOS and iOS simulator.
      targets: >-
        ["windows-x64", "windows-arm64", "linux-x64", "linux-arm64",
        "macos-arm64", "macos-x64", "ios-arm64-iphoneos",
        "ios-arm64-iphonesimulator", "ios-x64-iphonesimulator",
        "android-arm", "android-arm64", "android-x64"]
      runners: '{"windows-x64": {"runner": "windows-2025-vs2026"}}'
      # emscripten/emsdk:5.0.0.
      web-container: emscripten/emsdk@sha256:67df07bc59f86685818fa801d340b54e576fe4276cfd3bcfc4da61d564217737
      # The AudioWorklet check plays audio in Chrome.
      web-test-runner: macos-15
      # Flutter passes iOS 13 to build hooks (flutter_tools targetIOSVersion).
      build-args: >-
        {"*": ["--ios-version", "13", "--macos-version", "12",
        "--android-api", "24"]}
