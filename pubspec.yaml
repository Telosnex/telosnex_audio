name: telosnex_audio
description: >-
  Telosnex audio engine: WebRTC capture, echo cancellation, and a mixer with
  seekable, rate-changeable playback tracks.
version: 0.1.0
publish_to: none
repository: https://github.com/Telosnex/telosnex_audio

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: '>=1.0.0 <3.0.0'
  meta: ^1.16.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  # Android only: the Java side of the device routes (android/). The engine
  # itself comes from the build hook on every platform.
  plugin:
    platforms:
      android:
        package: com.telosnex.audio
        pluginClass: TelosnexAudioPlugin
  assets:
    - path: lib/web/telosnex_audio.wasm
      platforms: [web]
    - path: lib/web/telosnex_audio_worklet.js
      platforms: [web]
    - path: lib/web/telosnex_audio_storage.js
      platforms: [web]
