name: telosnex_audio
description: >-
  Audio engine for Flutter: microphone capture with WebRTC echo
  cancellation, and a mixer of playback tracks you can seek and speed up.
  Android, iOS, macOS, Linux, Windows and the web.
version: 0.1.0
repository: https://github.com/Telosnex/telosnex_audio
issue_tracker: https://github.com/Telosnex/telosnex_audio/issues

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: '>=1.0.0 <3.0.0'
  meta: ^1.16.0
  kiln: ^0.1.1
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  # Android only: the Java side of the device routes (android/). The engine
  # itself comes from the build hook on every platform.
  plugin:
    platforms:
      android:
        package: com.telosnex.audio
        pluginClass: TelosnexAudioPlugin
